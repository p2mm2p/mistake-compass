[package]
name = "scrape"
version = "0.1.0"
edition = "2024"
description = "按错题接口全量抓取，按分类树写出 YAML 数据文件"

[dependencies]
markup_fmt = "0.27"
regex = "1"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
# float_roundtrip 才与 Python json 逐位一致，否则 17 位小数会差 1 ulp。
serde_json = { version = "1", features = ["float_roundtrip"] }
# 写盘自检要能独立解析刚写出的 YAML，与 exam 用的是同一套解析器。
serde_norway = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
