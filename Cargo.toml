[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/storage",
    "crates/sync",
    "crates/ui",
    "crates/wasm",
    "crates/xtask",
]
default-members = ["crates/core", "crates/sync", "crates/ui"]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
mc_core = { path = "crates/core" }
storage = { path = "crates/storage" }
sync = { path = "crates/sync" }
ui = { path = "crates/ui" }

askama = "0.16"
form_urlencoded = "1"
futures = "0.3"
markup_fmt = "0.27"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
async-trait = "0.1"

flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gloo-timers = { version = "0.3", features = ["futures"] }
indexed_db_futures = "0.6.4"
js-sys = "0.3"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Navigator", "StorageManager", "Window"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
