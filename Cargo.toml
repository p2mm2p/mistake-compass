[package]
name = "mistake-compass"
version.workspace = true
edition.workspace = true
description = "把粉笔错题抓到本地、按分类复盘的自用工具"

[dependencies]
clap = { workspace = true, features = ["derive", "error-context"] }
exam = { path = "crates/exam" }
login = { path = "crates/login" }
scrape = { path = "crates/scrape" }

[workspace]
members = ["crates/login", "crates/scrape", "crates/exam"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
askama = "0.16"
axum = "0.8"
chromiumoxide = "0.9.1"
chrono = { version = "0.4", default-features = false }
clap = "4.6"
form_urlencoded = "1"
futures = "0.3"
markup_fmt = "0.27"
regex = "1"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
