name: 构建 Windows 可执行文件

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # 直接用 Windows runner 自带的 MSVC + Windows SDK，避免本机交叉编译时
    # aws-lc-sys 找不到 windows.h 的问题。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译 release
        run: cargo build --release --target x86_64-pc-windows-msvc --package mistake-compass
        env:
          # 静态链接 MSVC 运行库，目标机器不需要另装 VC++ 运行库。
          RUSTFLAGS: -C target-feature=+crt-static

      - name: 冒烟测试
        run: |
          target\x86_64-pc-windows-msvc\release\mistake-compass.exe --version
          target\x86_64-pc-windows-msvc\release\mistake-compass.exe --help

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mistake-compass-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/mistake-compass.exe

      # 打 v* tag 时把 exe 挂到 Release，Windows 上直接点下载即可。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            target/x86_64-pc-windows-msvc/release/mistake-compass.exe `
            --title $env:GITHUB_REF_NAME `
            --generate-notes
