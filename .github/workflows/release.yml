name: 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 安装 wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - uses: Swatinem/rust-cache@v2

      - name: 构建扩展包
        run: cargo xtask package

      - name: 上传扩展包
        uses: actions/upload-artifact@v4
        with:
          name: mistake-compass-extensions
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载扩展包
        uses: actions/download-artifact@v4
        with:
          pattern: mistake-compass-extensions
          merge-multiple: true

      - name: 创建 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md ./mistake-compass-*.zip
