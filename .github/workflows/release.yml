name: 发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: read
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - name: 检查 tag 与版本号一致
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: test "v$VERSION" = "$GITHUB_REF_NAME"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zip
          rustup target add x86_64-unknown-linux-musl

      - name: 安装 macOS 构建目标
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: 构建并打包 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          $version = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory package | Out-Null
          Copy-Item target\release\mistake-compass.exe package\
          Copy-Item scripts\windows\*.bat package\
          Compress-Archive -Path package\* -DestinationPath "mistake-compass-v$version-windows-x86_64.zip"

      - name: 构建并打包 Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          version="${{ needs.version.outputs.version }}"
          mkdir package
          cp target/x86_64-unknown-linux-musl/release/mistake-compass package/
          cp scripts/linux/*.sh package/
          chmod +x package/*.sh
          (cd package && zip "../mistake-compass-v$version-linux-x86_64.zip" *)

      - name: 构建并打包 macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          version="${{ needs.version.outputs.version }}"
          mkdir package
          lipo -create -output package/mistake-compass \
            target/x86_64-apple-darwin/release/mistake-compass \
            target/aarch64-apple-darwin/release/mistake-compass
          cp scripts/macos/*.command package/
          chmod +x package/*.command
          (cd package && zip "../mistake-compass-v$version-macos-universal.zip" *)

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: mistake-compass-v${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: mistake-compass-v*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载压缩包
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 创建 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md ./*.zip
