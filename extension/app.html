<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>错题罗盘</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="app.css">
  <script src="static/htmx.min.js"></script>
  <script src="host.js"></script>
  <script src="static/sidebar.js" defer></script>
  <script src="static/board.js" type="module" defer></script>
  <script src="htmx-adapter.js" type="module"></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <div id="data-controls">
    <button id="sync-button" type="button" disabled>抓取错题</button>
    <button id="export-button" type="button" disabled>导出备份</button>
    <label>
      导入备份
      <input id="import-input" type="file" accept=".zip,application/zip" disabled>
    </label>
    <span id="data-warning">卸载扩展会删除本地 IndexedDB 数据。卸载前先导出备份。</span>
    <span id="persist-status"></span>
    <span id="sync-status" role="status"></span>
    <p id="backup-status" role="status"></p>
    <pre id="sync-progress"></pre>
  </div>
  <div id="app">
    <p class="hint">加载中</p>
  </div>
</body>
</html>
